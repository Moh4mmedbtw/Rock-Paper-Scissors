<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel='stylesheet' href="styles/12-RPS Final.css">
  </head>

  <body>
      <p class="title">
        Rock Paper Scissors-MohammedA
      </p>

      <button class="move-button js-rock-button"><img src="images/Rock-emoji.png" class="move-icon"
      ></button>

      <button class="move-button js-paper-button"><img src="images/Paper-emoji.png" class="move-icon"
      ></button>

      <button onclick=" 
        result('Scissors')
      " class="move-button js-scissors-button"><img src="images/Scissors-emoji.png" class="move-icon"
      ></button>

      <p class="js-result result"></p>

      <p class="js-moves"></p>
      
      <p class="js-score score"></p>

      <button onclick="
        score.wins=0;
        score.loses=0;
        score.draws=0;
        alert('The Score has been Reset');
        update()
        localStorage.removeItem('score'); 
      " class="reset-score-button">Reset</button>

      <button class="auto-play-button" onclick="autoPlay();">Auto   Play</button>
      

      
  <script src = "scripts/12-RPS Final.js"></script>
  </body>
</html>
